{% extends "dashboard/base.html" %}

{% block page_title %}Create Class{% endblock %}
{% block page_subtitle %}Set up a new class to manage students and exams.{% endblock %}

{% block dashboard_content %}
<div class="dashboard-body" style="display:block;">
    <div style="max-width: 600px; margin: 0 auto; background: var(--white); border: 1px solid var(--gray-200); border-radius: 1rem; padding: 2rem;">
        
        <form id="createClassForm" onsubmit="handleCreateClass(event)">
            <div style="margin-bottom: 1.5rem;">
                <label for="className" style="display: block; font-weight: 500; margin-bottom: 0.5rem; color: var(--gray-800);">Class Name <span style="color:var(--danger);">*</span></label>
                <input type="text" id="className" required placeholder="e.g. Computer Science 101" style="width: 100%; padding: 0.75rem 1rem; border: 1px solid var(--gray-300); border-radius: 0.5rem; font-family: inherit; box-sizing: border-box;">
            </div>

            <div style="margin-bottom: 2rem;">
                <label for="classDesc" style="display: block; font-weight: 500; margin-bottom: 0.5rem; color: var(--gray-800);">Description</label>
                <textarea id="classDesc" rows="4" placeholder="Briefly describe what this class is about..." style="width: 100%; padding: 0.75rem 1rem; border: 1px solid var(--gray-300); border-radius: 0.5rem; font-family: inherit; resize: vertical; box-sizing: border-box;"></textarea>
            </div>

            <div style="display: flex; gap: 1rem; justify-content: flex-end;">
                <a href="{{ url_for('dashboard.classes') }}" class="btn-secondary" style="text-decoration:none;">Cancel</a>
                <button type="submit" class="btn-primary" id="submitBtn">
                    <i data-lucide="plus-circle" style="width: 18px; height: 18px; margin-right: 0.5rem;"></i> Create Class
                </button>
            </div>
        </form>

    </div>
</div>

<script>
async function handleCreateClass(e) {
    e.preventDefault();
    const btn = document.getElementById('submitBtn');
    btn.disabled = true;
    btn.innerHTML = '<i data-lucide="loader-2" style="animation: spin 1s linear infinite; margin-right: 0.5rem;"></i> Creating...';
    lucide.createIcons();

    const name = document.getElementById('className').value;
    const desc = document.getElementById('classDesc').value;

    try {
        const response = await fetch('/api/classes/', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'Authorization': `Bearer ${localStorage.getItem('access_token') || ''}`
            },
            body: JSON.stringify({ name: name, description: desc })
        });
        
        const data = await response.json();
        
        if (data.success) {
            showToast("Class created successfully!", "success");
            setTimeout(() => {
                window.location.href = "{{ url_for('dashboard.classes') }}";
            }, 1000);
        } else {
            showToast(data.error || "Failed to create class", "error");
            if (data.limit_reached && data.upgrade_url) {
                setTimeout(() => { window.location.href = data.upgrade_url; }, 2000);
            }
            resetBtn();
        }
    } catch (err) {
        showToast("An error occurred while creating the class.", "error");
        resetBtn();
    }
}

function resetBtn() {
    const btn = document.getElementById('submitBtn');
    btn.disabled = false;
    btn.innerHTML = '<i data-lucide="plus-circle" style="width: 18px; height: 18px; margin-right: 0.5rem;"></i> Create Class';
    lucide.createIcons();
}
</script>
<style>
@keyframes spin { 100% { transform: rotate(360deg); } }
</style>
{% endblock %}
