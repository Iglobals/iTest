{% extends "dashboard/base.html" %}
{% block title %}Messages - iTest{% endblock %}

{% block dashboard_head %}
<style>
    .messages-shell {
        display: flex;
        height: calc(100vh - 120px);
        background: var(--white);
        border-radius: 1rem;
        border: 1px solid var(--gray-200);
        overflow: hidden;
    }

    .thread-list {
        width: 22rem;
        flex-shrink: 0;
        border-right: 1px solid var(--gray-200);
        display: flex;
        flex-direction: column;
        overflow-y: auto;
    }

    .thread-list-header {
        padding: 1.25rem 1.5rem;
        border-bottom: 1px solid var(--gray-200);
        display: flex;
        align-items: center;
        justify-content: space-between;
    }

    .thread-list-header h2 {
        margin: 0;
        font-size: 1.15rem;
        font-weight: 700;
        color: var(--gray-900);
    }

    .thread-item {
        padding: 1rem 1.5rem;
        border-bottom: 1px solid var(--gray-100);
        cursor: pointer;
        display: flex;
        flex-direction: column;
        gap: 0.25rem;
        transition: background 0.15s;
    }

    .thread-item:hover, .thread-item.active {
        background: var(--gray-50);
    }

    .thread-item-top {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 0.5rem;
    }

    .thread-item-name {
        font-weight: 600;
        color: var(--gray-900);
        font-size: 0.95rem;
    }

    .thread-item-preview {
        font-size: 0.85rem;
        color: var(--gray-500);
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
    }

    .unread-badge {
        background: var(--purple);
        color: var(--white);
        font-size: 0.7rem;
        font-weight: 700;
        min-width: 1.25rem;
        height: 1.25rem;
        border-radius: 1rem;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 0 0.35rem;
        flex-shrink: 0;
    }

    .exam-context-tag {
        display: inline-flex;
        align-items: center;
        gap: 0.3rem;
        font-size: 0.7rem;
        color: var(--purple);
        background: var(--purple-bg, #f3e8ff);
        padding: 0.15rem 0.5rem;
        border-radius: 1rem;
        margin-top: 0.15rem;
        width: fit-content;
    }

    .chat-pane {
        flex: 1;
        display: flex;
        flex-direction: column;
        min-width: 0;
    }

    .chat-header {
        padding: 1.25rem 1.5rem;
        border-bottom: 1px solid var(--gray-200);
        display: flex;
        align-items: center;
        justify-content: space-between;
        background: var(--gray-50);
    }

    .chat-header-info h2 {
        margin: 0;
        font-size: 1.15rem;
        font-weight: 700;
        color: var(--gray-900);
    }

    .chat-body {
        flex: 1;
        overflow-y: auto;
        padding: 1.5rem;
        display: flex;
        flex-direction: column;
        gap: 1.25rem;
    }

    .chat-message {
        display: flex;
        flex-direction: column;
        gap: 0.4rem;
        max-width: 75%;
    }
    .chat-message.self { align-self: flex-end; }
    .chat-message.other { align-self: flex-start; }

    .chat-message-meta {
        font-size: 0.75rem;
        color: var(--gray-500);
    }
    .chat-message.self .chat-message-meta { text-align: right; }

    .chat-bubble {
        padding: 0.85rem 1.1rem;
        border-radius: 1rem;
        line-height: 1.5;
        font-size: 0.95rem;
        white-space: pre-wrap;
        word-break: break-word;
    }
    .chat-message.self .chat-bubble {
        background: var(--purple);
        color: var(--white);
        border-bottom-right-radius: 0.25rem;
    }
    .chat-message.other .chat-bubble {
        background: var(--gray-100);
        color: var(--gray-900);
        border-bottom-left-radius: 0.25rem;
    }

    .chat-footer {
        padding: 1.25rem 1.5rem;
        border-top: 1px solid var(--gray-200);
    }

    .chat-input-wrapper {
        display: flex;
        align-items: center;
        gap: 0.75rem;
        background: var(--gray-50);
        border: 1px solid var(--gray-300);
        border-radius: 2rem;
        padding: 0.5rem 0.5rem 0.5rem 1.25rem;
    }
    .chat-input-wrapper:focus-within {
        border-color: var(--purple);
        background: var(--white);
    }

    .chat-input {
        flex: 1;
        border: none;
        background: transparent;
        outline: none;
        font-size: 0.95rem;
        padding: 0.5rem 0;
    }

    .chat-send-btn {
        background: var(--purple);
        color: var(--white);
        border: none;
        width: 36px;
        height: 36px;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
    }
    .chat-send-btn:disabled { background: var(--gray-300); cursor: not-allowed; }

    .empty-pane {
        flex: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        color: var(--gray-400);
        gap: 0.5rem;
    }

    .modal-overlay-msg {
        display: none;
        position: fixed; inset: 0;
        background: rgba(0,0,0,0.4);
        align-items: center;
        justify-content: center;
        z-index: 2000;
    }
    .modal-overlay-msg.show { display: flex; }
    .compose-modal {
        background: var(--white);
        border-radius: 1rem;
        padding: 1.5rem;
        width: 100%;
        max-width: 26rem;
    }
    .compose-modal h3 { margin-top: 0; }
    .compose-modal select, .compose-modal textarea {
        width: 100%;
        border: 1px solid var(--gray-300);
        border-radius: 0.5rem;
        padding: 0.6rem 0.8rem;
        font-size: 0.9rem;
        margin-bottom: 1rem;
        font-family: inherit;
    }

    .chat-back-btn {
        display: none;
        background: none;
        border: none;
        cursor: pointer;
        color: var(--gray-600);
        padding: 0.4rem;
        margin-right: 0.5rem;
        align-items: center;
        justify-content: center;
    }

    /* Mobile / narrow tablets: the list and the open conversation each take
       the full width, one at a time, instead of sitting side by side. */
    @media (max-width: 48rem) {
        .messages-shell {
            position: relative;
        }

        .thread-list {
            width: 100%;
            border-right: none;
        }

        .chat-pane {
            display: none;
            position: absolute;
            inset: 0;
            background: var(--white);
        }

        .messages-shell.chat-open .thread-list {
            display: none;
        }

        .messages-shell.chat-open .chat-pane {
            display: flex;
        }

        .chat-back-btn {
            display: flex;
        }
    }
</style>
{% endblock %}

{% block dashboard_content %}
<div class="messages-shell">
    <div class="thread-list">
        <div class="thread-list-header">
            <h2>Messages</h2>
            <button class="chat-send-btn" id="newMessageBtn" title="New message" style="display:none;">
                <i data-lucide="plus" style="width:16px;height:16px;"></i>
            </button>
        </div>
        <div id="threadListBody">
            <div style="text-align:center; color:var(--gray-400); margin: 2rem 0;">Loading...</div>
        </div>
    </div>

    <div class="chat-pane" id="chatPane">
        <div class="empty-pane">
            <i data-lucide="message-square" style="width:48px;height:48px;opacity:0.5;"></i>
            <p>Select a conversation to view it.</p>
        </div>
    </div>
</div>

<div class="modal-overlay-msg" id="composeModal">
    <div class="compose-modal">
        <h3>New Message</h3>
        <select id="composeReceiver">
            <option value="">Select a recipient...</option>
        </select>
        <textarea id="composeBody" rows="4" placeholder="Type your message..."></textarea>
        <div style="display:flex; justify-content:flex-end; gap:0.75rem;">
            <button class="btn-outline" style="width:auto; height:auto; padding:0.5em 1em;" onclick="closeComposeModal()">Cancel</button>
            <button class="btn-primary" style="width:auto; height:auto; padding:0.5em 1em;" onclick="sendComposedMessage()">Send</button>
        </div>
    </div>
</div>

<script>
const currentUserId = "{{ g.current_user._id }}";
const currentUserRole = "{{ g.current_user.role }}";
const canCompose = ['teacher', 'org_admin'].includes(currentUserRole);

const params = new URLSearchParams(window.location.search);
const pendingCompose = params.get('compose_to') ? {
    receiverId: params.get('compose_to'),
    receiverName: params.get('to_name') || 'Teacher',
    examId: params.get('exam_id') || null,
    examTitle: params.get('exam_title') || null,
    sessionId: params.get('session_id') || null,
} : null;

let activeThreadKey = null;
let threadsCache = [];

async function apiCall(path, method = 'GET', body = null) {
    const opts = { method, headers: { 'Content-Type': 'application/json' } };
    if (body) opts.body = JSON.stringify(body);
    const res = await fetch(`/api/messages${path}`, opts);
    const json = await res.json().catch(() => ({}));
    if (!res.ok) {
        alert(json.error || 'Something went wrong.');
    }
    return json;
}

function threadOtherLabel(t) {
    return t.related_exam_title ? `${t.other_user.name}` : t.other_user.name;
}

async function loadThreads(selectKeyAfter) {
    const res = await apiCall('/threads');
    if (!res.success) return;
    threadsCache = res.data;

    const body = document.getElementById('threadListBody');
    if (threadsCache.length === 0 && !pendingCompose) {
        body.innerHTML = `<div style="text-align:center; color:var(--gray-400); margin: 2rem 1.5rem;">
            <i data-lucide="inbox" style="width:36px;height:36px;opacity:0.5;"></i>
            <p style="margin-top:0.5rem; font-size:0.9rem;">No conversations yet.</p>
        </div>`;
        lucide.createIcons();
        return;
    }

    body.innerHTML = threadsCache.map(t => `
        <div class="thread-item ${t.thread_key === activeThreadKey ? 'active' : ''}" onclick="openThread('${t.thread_key}')">
            <div class="thread-item-top">
                <span class="thread-item-name">${threadOtherLabel(t)}</span>
                ${t.unread_count > 0 ? `<span class="unread-badge">${t.unread_count}</span>` : ''}
            </div>
            <span class="thread-item-preview">${t.last_message || ''}</span>
            ${t.related_exam_title ? `<span class="exam-context-tag"><i data-lucide="file-text" style="width:11px;height:11px;"></i> ${t.related_exam_title}</span>` : ''}
        </div>
    `).join('');
    lucide.createIcons();

    if (selectKeyAfter) {
        openThread(selectKeyAfter);
    }
}

function renderChatHeader(name, examTitle, sessionId) {
    const examLine = examTitle
        ? `<p style="margin:0; font-size:0.8rem; color:var(--gray-500);">Re: ${examTitle}</p>`
        : '';
    const gradeLink = (sessionId && ['teacher', 'org_admin', 'platform_admin'].includes(currentUserRole))
        ? `<a href="/dashboard/sessions/${sessionId}/grade" class="btn-outline" style="width:auto; height:auto; padding:0.4em 0.8em; font-size:0.8em; text-decoration:none;">
               <i data-lucide="edit-3" style="width:14px;height:14px; vertical-align:middle;"></i> View &amp; Grade This Exam
           </a>`
        : '';

    document.getElementById('chatPane').innerHTML = `
        <div class="chat-header">
            <button class="chat-back-btn" onclick="goBackToThreadList()" aria-label="Back to conversations">
                <i data-lucide="arrow-left" style="width:18px;height:18px;"></i>
            </button>
            <div class="chat-header-info" style="flex:1;">
                <h2>${name}</h2>
                ${examLine}
            </div>
            ${gradeLink}
        </div>
        <div class="chat-body" id="chatBody"></div>
        <div class="chat-footer">
            <div class="chat-input-wrapper">
                <input type="text" id="replyInput" class="chat-input" placeholder="Type a reply..." autocomplete="off">
                <button class="chat-send-btn" id="replySendBtn"><i data-lucide="send" style="width:16px;height:16px;margin-left:-2px;"></i></button>
            </div>
        </div>
    `;
    lucide.createIcons();
}

function renderMessages(msgs) {
    const body = document.getElementById('chatBody');
    if (!body) return;
    body.innerHTML = msgs.map(m => {
        const isSelf = m.sender_id === currentUserId;
        const time = new Date(m.created_at).toLocaleString([], { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' });
        return `
            <div class="chat-message ${isSelf ? 'self' : 'other'}">
                <div class="chat-bubble">${m.body}</div>
                <div class="chat-message-meta">${time}</div>
            </div>
        `;
    }).join('');
    body.scrollTop = body.scrollHeight;
}

// Mobile drill-in: opening a conversation pushes a history entry so the
// device's native swipe-back gesture (and the on-screen back button) both
// return to the thread list, instead of leaving the browser's back button.
function openMobileChat() {
    document.querySelector('.messages-shell').classList.add('chat-open');
    if (window.matchMedia('(max-width: 48rem)').matches) {
        history.pushState({ chatOpen: true }, '', location.pathname);
    }
}

function closeMobileChat() {
    document.querySelector('.messages-shell').classList.remove('chat-open');
}

function goBackToThreadList() {
    if (history.state && history.state.chatOpen) {
        history.back();
    } else {
        closeMobileChat();
    }
}

window.addEventListener('popstate', (e) => {
    if (!e.state || !e.state.chatOpen) {
        closeMobileChat();
    }
});

async function openThread(threadKey) {
    activeThreadKey = threadKey;
    const thread = threadsCache.find(t => t.thread_key === threadKey);
    if (!thread) return;

    renderChatHeader(thread.other_user.name, thread.related_exam_title, thread.related_session_id || null);
    openMobileChat();

    const res = await apiCall(`/threads/${threadKey}`);
    if (res.success) renderMessages(res.data);

    document.querySelectorAll('.thread-item').forEach(el => el.classList.remove('active'));
    loadThreads(); // refresh unread counts/highlight without losing the open pane

    const input = document.getElementById('replyInput');
    const btn = document.getElementById('replySendBtn');
    const send = async () => {
        const body = input.value.trim();
        if (!body) return;
        btn.disabled = true;
        const receiverId = thread.other_user.user_id;
        const res = await apiCall('/send', 'POST', { receiver_id: receiverId, body });
        if (res.success) {
            input.value = '';
            const t2 = await apiCall(`/threads/${threadKey}`);
            if (t2.success) renderMessages(t2.data);
        }
        btn.disabled = false;
    };
    btn.addEventListener('click', send);
    input.addEventListener('keypress', e => { if (e.key === 'Enter') send(); });
}

function openPendingCompose() {
    renderChatHeader(pendingCompose.receiverName, pendingCompose.examTitle, null);
    openMobileChat();
    document.getElementById('chatBody').innerHTML = `<div style="text-align:center; color:var(--gray-400); margin:auto;">
        Start the conversation below.
    </div>`;

    const input = document.getElementById('replyInput');
    const btn = document.getElementById('replySendBtn');
    input.placeholder = `Message ${pendingCompose.receiverName}...`;
    const send = async () => {
        const body = input.value.trim();
        if (!body) return;
        btn.disabled = true;
        const res = await apiCall('/send', 'POST', {
            receiver_id: pendingCompose.receiverId,
            body,
            related_exam_id: pendingCompose.examId,
            related_session_id: pendingCompose.sessionId,
        });
        btn.disabled = false;
        if (res.success) {
            window.history.replaceState({}, '', '/dashboard/messages');
            await loadThreads(res.data.thread_key);
        }
    };
    btn.addEventListener('click', send);
    input.addEventListener('keypress', e => { if (e.key === 'Enter') send(); });
}

async function openComposeModal() {
    const res = await apiCall('/contacts');
    const select = document.getElementById('composeReceiver');
    select.innerHTML = '<option value="">Select a recipient...</option>' +
        (res.data || []).map(c => `<option value="${c.user_id}">${c.name} (${c.role.replace('_', ' ')})</option>`).join('');
    document.getElementById('composeModal').classList.add('show');
}

function closeComposeModal() {
    document.getElementById('composeModal').classList.remove('show');
    document.getElementById('composeBody').value = '';
}

async function sendComposedMessage() {
    const receiverId = document.getElementById('composeReceiver').value;
    const body = document.getElementById('composeBody').value.trim();
    if (!receiverId || !body) return;
    const res = await apiCall('/send', 'POST', { receiver_id: receiverId, body });
    if (res.success) {
        closeComposeModal();
        await loadThreads(res.data.thread_key);
    }
}

document.getElementById('newMessageBtn').addEventListener('click', openComposeModal);

if (canCompose) {
    document.getElementById('newMessageBtn').style.display = 'flex';
}

(async function init() {
    await loadThreads();
    if (pendingCompose) {
        openPendingCompose();
    } else if (threadsCache.length > 0 && !window.matchMedia('(max-width: 48rem)').matches) {
        // Desktop only: land on the first conversation by default. On mobile
        // the list itself is the landing view - a thread only opens full-
        // screen once the user actually taps one.
        openThread(threadsCache[0].thread_key);
    }
})();
</script>
{% endblock %}
