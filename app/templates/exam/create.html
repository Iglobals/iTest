{% extends "base.html" %}

{% block title %}Create Exam{% endblock %}

{% block extra_css %}
<style>
    .step-container { display: none; animation: fadeIn 0.4s; }
    .step-container.active { display: block; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    
    .wizard-progress { display: flex; justify-content: space-between; margin-bottom: 2rem; position: relative; }
    .wizard-progress::before { content: ''; position: absolute; top: 50%; left: 0; width: 100%; height: 2px; background: var(--border); z-index: 1; transform: translateY(-50%); }
    .wizard-step-marker { width: 30px; height: 30px; border-radius: 50%; background: white; border: 2px solid var(--border); color: var(--text-muted); display: flex; align-items: center; justify-content: center; font-weight: bold; position: relative; z-index: 2; transition: all 0.3s; }
    .wizard-step-marker.active { border-color: var(--color-purple); background: var(--color-purple); color: white; }
    .wizard-step-marker.completed { border-color: var(--success); background: var(--success); color: white; }
</style>
{% endblock %}

{% block content %}
<div class="container" style="max-width: 800px; padding: var(--spacing-lg) 0;">
    <div class="card">
        <h2 style="text-align: center; margin-bottom: 2rem;">Create New Exam</h2>
        
        <div class="wizard-progress">
            <div class="wizard-step-marker active" id="marker-1">1</div>
            <div class="wizard-step-marker" id="marker-2">2</div>
            <div class="wizard-step-marker" id="marker-3">3</div>
        </div>

        <form id="createExamForm" action="/exams/create" method="POST">
            
            <!-- Step 1: Basic Info -->
            <div class="step-container active" id="step-1">
                <h3>Basic Information</h3>
                <div class="form-group">
                    <label>Exam Title</label>
                    <input type="text" name="title" class="form-control" required placeholder="e.g. Mid-term Physics">
                </div>
                <div class="form-group">
                    <label>Description</label>
                    <textarea name="description" class="form-control" rows="3" placeholder="Brief description of the exam..."></textarea>
                </div>
                <div class="form-group">
                    <label>Subject</label>
                    <select name="subject_id" class="form-control">
                        <option value="math">Mathematics</option>
                        <option value="science">Science</option>
                        <option value="arts">Arts</option>
                    </select>
                </div>
                <div style="text-align: right; margin-top: 1.5rem;">
                    <button type="button" class="btn btn-primary" onclick="nextStep(1)">Next <i class="ph-bold ph-arrow-right"></i></button>
                </div>
            </div>

            <!-- Step 2: Settings -->
            <div class="step-container" id="step-2">
                <h3>Exam Settings</h3>
                <div class="form-group">
                    <label>Duration (minutes)</label>
                    <input type="number" name="duration" class="form-control" value="60" min="1">
                </div>
                <div class="form-group" style="display: flex; gap: 1rem; margin-top: 1rem;">
                    <label style="display: flex; align-items: center; gap: 0.5rem;">
                        <input type="checkbox" name="randomize_questions" checked> Randomize Questions
                    </label>
                    <label style="display: flex; align-items: center; gap: 0.5rem;">
                        <input type="checkbox" name="show_result_immediately" checked> Show Instant Results (MCQ only)
                    </label>
                </div>
                <div style="display: flex; justify-content: space-between; margin-top: 1.5rem;">
                    <button type="button" class="btn btn-secondary" onclick="prevStep(2)"><i class="ph-bold ph-arrow-left"></i> Back</button>
                    <button type="button" class="btn btn-primary" onclick="nextStep(2)">Next <i class="ph-bold ph-arrow-right"></i></button>
                </div>
            </div>

            <!-- Step 3: Audience & Publish -->
            <div class="step-container" id="step-3">
                <h3>Assign Audience</h3>
                <div class="form-group">
                    <label>Assign to Class</label>
                    <select name="class_id" class="form-control">
                        <option value="all">All My Students</option>
                        <option value="class1">Class A - Physics</option>
                    </select>
                </div>
                <div class="form-group" style="margin-top: 1rem;">
                    <label>Availability</label>
                    <div style="display: flex; gap: 1rem;">
                        <input type="datetime-local" name="available_from" class="form-control">
                        <input type="datetime-local" name="available_until" class="form-control">
                    </div>
                </div>
                <div style="display: flex; justify-content: space-between; margin-top: 1.5rem;">
                    <button type="button" class="btn btn-secondary" onclick="prevStep(3)"><i class="ph-bold ph-arrow-left"></i> Back</button>
                    <button type="submit" class="btn" style="background: var(--success); color: white;"><i class="ph-bold ph-check"></i> Create Exam</button>
                </div>
            </div>

        </form>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
    function nextStep(current) {
        document.getElementById('step-' + current).classList.remove('active');
        document.getElementById('step-' + (current + 1)).classList.add('active');
        document.getElementById('marker-' + current).classList.remove('active');
        document.getElementById('marker-' + current).classList.add('completed');
        document.getElementById('marker-' + (current + 1)).classList.add('active');
    }
    
    function prevStep(current) {
        document.getElementById('step-' + current).classList.remove('active');
        document.getElementById('step-' + (current - 1)).classList.add('active');
        document.getElementById('marker-' + current).classList.remove('active');
        document.getElementById('marker-' + (current - 1)).classList.remove('completed');
        document.getElementById('marker-' + (current - 1)).classList.add('active');
    }
</script>
{% endblock %}
